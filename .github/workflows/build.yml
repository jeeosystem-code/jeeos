name: Build Ascend APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install packages
        run: npm install
      - name: Prepare web files
        run: node scripts/prepare.js
      - name: Create Android project
        run: npx cap add android
      - name: Add home-screen widgets
        run: node scripts/native.js
      - name: Icons and splash screens
        run: npx capacitor-assets generate --android
      - name: Android settings (vibration, portrait)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M
          grep -n "VIBRATE\|screenOrientation" $M
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Ascend-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
