name: Build Ascend APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the uploaded kit
        run: |
          Z=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$Z" ]; then echo "No zip found in the repo root"; exit 1; fi
          echo "Using $Z"
          rm -rf kit && mkdir kit && unzip -q "$Z" -d kit
          P=$(find kit -name package.json -not -path "*/node_modules/*" | head -n 1)
          echo "KIT_DIR=$(dirname "$P")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and add Android
        working-directory: ${{ env.KIT_DIR }}
        run: |
          npm install
          npx cap add android
          node scripts/native.js
          npx cap sync android
      - name: Build debug APK
        working-directory: ${{ env.KIT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Ascend-APK
          path: ${{ env.KIT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
